    <section class="screen" id="screen-log">
      <h2 class="screen-title">📜 Data Log (5 Min)</h2>
      <div class="glass-card log-container" style="max-height: calc(100vh - 200px); overflow-y: auto;">
        <table class="log-table">
          <thead>
            <tr>
              <th style="text-align: left;">Time</th>
              <th>GPS</th>
              <th>Speed</th>
              <th>RPM</th>
              <th>Tilt</th>
              <th>Accel</th>
              <th>Sats</th>
              <th>Coords</th>
            </tr>
          </thead>
          <tbody id="log-tbody">
            <!-- Rows dynamically inserted here -->
          </tbody>
        </table>
      </div>
    </section>
