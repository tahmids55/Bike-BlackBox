<!DOCTYPE html>
<html>
<head>
    <title>GPS Tracker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; }
        #map { height: 100vh; width: 100%; }
        #info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="info">
        <strong>GPS Tracker</strong><br>
        Lat: <span id="lat">--</span><br>
        Lng: <span id="lng">--</span><br>
        Speed: <span id="speed">--</span> km/h<br>
        Sats: <span id="sats">--</span><br>
        Time: <span id="time">--</span>
    </div>

    <script>
        // Initialize map centered at a default location (will jump to GPS fix later)
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Marker that will be moved
        const marker = L.marker([0, 0]).addTo(map);
        let firstFix = true;

        function fetchLocation() {
            fetch('/latest')
                .then(response => response.json())
                .then(data => {
                    if (data.lat !== 0 && data.lng !== 0) {
                        const lat = data.lat;
                        const lng = data.lng;

                        // Update marker position
                        marker.setLatLng([lat, lng]);

                        // Center map on first fix
                        if (firstFix) {
                            map.setView([lat, lng], 15);
                            firstFix = false;
                        }

                        // Update info panel
                        document.getElementById('lat').textContent = lat.toFixed(6);
                        document.getElementById('lng').textContent = lng.toFixed(6);
                        document.getElementById('speed').textContent = data.speed.toFixed(1);
                        document.getElementById('sats').textContent = data.satellites;
                        document.getElementById('time').textContent = data.timestamp;
                    }
                })
                .catch(err => console.error('Fetch error:', err));
        }

        // Poll every 1 second
        setInterval(fetchLocation, 1000);
        fetchLocation(); // immediate first call
    </script>
</body>
</html>
